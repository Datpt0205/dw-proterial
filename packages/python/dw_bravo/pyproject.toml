[project]
name = "dw-bravo"
version = "0.1.0"
description = "Bravo shared by DW1 and DW2: a screen's own XML rules, run from its layout (sales ticket 59)"
requires-python = ">=3.12"
# Standard library only: the runner reads XML and evaluates expressions. What
# it asks Bravo goes through `dw_bravo.ports`, never a driver (ADR 0026).
dependencies = []

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_bravo"]
