[project]
name = "dw-purchasing"
version = "0.1.0"
description = "Purchasing bounded context"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-agent-runtime",
    # Pinned to match the packages that already own these: `apps/api` for
    # FastAPI, `dw_platform` for PyYAML. A context that picked its own range
    # would be a second opinion about one fact, and uv would refuse the
    # workspace the first time the two disagreed. No LangGraph: DW2 has no
    # graph (`configs/workers/purchasing.yaml`).
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    # The Bravo import file (`adapters/bravo_file.py`): written, never parsed.
    "openpyxl>=3.1,<4",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
]

[project.optional-dependencies]
# `dw_purchasing.testing.eval_graders`: the `purchasing.*` graders speak the
# eval runner's types. An extra, as Sales' is: the API and worker images never
# import the graders, and `scripts/run_evals.py` runs from the workspace.
evals = ["dw-evals"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_purchasing"]
