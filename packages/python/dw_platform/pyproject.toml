[project]
name = "dw-platform"
version = "0.1.0"
description = "Platform context: tenancy, identity, entitlement, authorization, approval, audit, outbox"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "pyjwt[crypto]>=2.15,<3",
    "redis>=5,<6",
    # Keycloak's admin REST API (adapters/identity/keycloak_accounts.py).
    "httpx>=0.28,<1",
    # A spreadsheet cell written as text, never a formula (`adapters/spreadsheet.py`):
    # the range `dw_sales` declares.
    "openpyxl>=3.1,<4",
    # Web Push (Sales ticket 48, `adapters/web_push.py`): the sender, pinned
    # and measured against a local endpoint before it was depended on; the
    # VAPID key it signs with, and the curve the public key is read from.
    "pywebpush==2.5.0",
    "py-vapid>=1.9.6,<2",
    "cryptography>=44,<51",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_platform"]
