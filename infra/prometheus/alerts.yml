# Ops hardening Phase 5 — minimal, deliberately. Every rule here fires on a
# metric this codebase actually emits today; a rule against a metric nobody
# writes yet would be decoration; see .claude/rules/failure-modes.md #1.
#
# One condition, named rather than papered over:
#   - DwReaperRepeatedlyReaping (below) fires only where a bounded context
#     registered a `ReapTarget` (apps/worker/src/dw_worker/main.py). Sales
#     registers one for its processing lane when DW1 is mounted
#     (`SALES_DEMO_*`) and object storage is configured (`s3_endpoint_url`);
#     a deployment without DW1 has nothing to trip it.
#
# `dw_node_failure_total` was the second: declared and emitted by nothing. The
# runner emits it since 2026-10-15 (LangGraphWorkflowRunner._count_failed_node,
# once per run that fails inside a node of its worker graph), and
# DwNodeRepeatedlyFailing below reads it.
groups:
  - name: dw-platform
    rules:
      - alert: DwApiDown
        expr: up{job="dw-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "dw-api is not answering /metrics"
          description: "Prometheus has not been able to scrape dw-api for 2 minutes."

      - alert: DwWorkerDown
        expr: up{job="dw-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "dw-worker is not answering /metrics"
          description: >
            The worker's own scrape target is down for 2 minutes — the process
            is gone or its event loop is wedged. Distinct from
            DwOutboxBacklogAboveThreshold, which catches a worker that is
            still up but not draining one lane.

      - alert: DwPostgresConnectionsNearLimit
        expr: sum(pg_stat_database_numbackends) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connections above 80% of max_connections"
          description: >
            dw_app's pool (10 + 20 overflow per apps/api/src/dw_api/bootstrap/wiring.py)
            plus every other connected role is approaching the server's ceiling.

      - alert: DwOutboxBacklogAboveThreshold
        # 500 is a starting point, not a measured threshold — this platform
        # has no bounded context generating outbox volume yet (see CLAUDE.md,
        # "Once ops hardening lands"). Revisit once real traffic exists.
        expr: dw_outbox_backlog_size > 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog above 500 for 15 minutes"
          description: >
            {{ $value }} events are pending for the types dw-worker handles;
            dw_outbox_oldest_pending_age_seconds says how stale the oldest one is.

      - alert: DwReaperRepeatedlyReaping
        # See the file header: fires only where a context registered a
        # ReapTarget. 20/hour is provisional for the same reason the backlog
        # threshold above is.
        expr: increase(dw_reaper_reaped_total[1h]) > 20
        labels:
          severity: warning
        annotations:
          summary: "The reaper is repeatedly settling abandoned rows in one queue"
          description: >
            {{ $labels.queue }} reaped {{ $value }} abandoned row(s) in the last
            hour — a healthy worker for that queue should rarely die mid-job.

      - alert: DwRunFailureRateSpike
        expr: rate(dw_run_total{status="failed"}[5m]) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Run failure rate above 0.2/s over 5 minutes"
          description: "dw_run_total{status=\"failed\"} is climbing faster than usual."

      - alert: DwNodeRepeatedlyFailing
        # Finer than DwRunFailureRateSpike: which node of which worker keeps
        # failing, and with what. 5 in 15 minutes is provisional for the same
        # reason the backlog threshold is: no real traffic has set it yet.
        expr: sum by (worker, node, error_type) (increase(dw_node_failure_total[15m])) > 5
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.worker }} keeps failing in node {{ $labels.node }}"
          description: >
            {{ $value }} run(s) of {{ $labels.worker }} failed in node
            {{ $labels.node }} with {{ $labels.error_type }} in the last 15 minutes.

      - alert: DwTelemetryStoreDown
        # The log and trace pipeline (2026-11-05). DW keeps working without
        # it, so a warning; but every minute it is down is a minute nobody can
        # look back on, so it is not left to be noticed in Grafana.
        expr: up{job=~"loki|tempo|alloy"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} is down: logs or traces are not being kept"
          description: "Prometheus has not been able to scrape {{ $labels.job }} for 5 minutes."

      - alert: DwLaneStale
        # Sales ticket 84. A worker lane that has not finished a clean tick
        # for three of its own intervals, and never less than 30 minutes: one
        # that fails every tick, fails in one workspace every tick (the scope
        # loops raise after the last scope), hangs, or never once succeeded.
        # The interval is the worker's own (`dw_lane_interval_seconds`, from
        # `ConsumerRegistry.interval_for`), so no lane's cadence is copied
        # here. The 30-minute floor keeps a fast queue lane with one slow model
        # call from paging; it is a starting point, not a measurement.
        expr: >
          (time() - dw_lane_last_ok_timestamp_seconds)
            > clamp_min(3 * dw_lane_interval_seconds, 1800)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker lane {{ $labels.lane }} has not finished a clean tick"
          description: >
            {{ $labels.lane }} last finished a tick without an error
            {{ $value | humanizeDuration }} ago. Its log in dw-worker says why
            ("consumer {{ $labels.lane }} failed").

      - alert: DwOutboxEventStuck
        # Sales ticket 84. The gauge was emitted and read by no rule. An event
        # pending half an hour is one lane not draining (a handler that keeps
        # failing retries until its attempts are spent; a spent one is told to
        # the tenant's administrators by `outbox_alarms`). 1800 s is a
        # starting point until the plant's traffic measures it.
        expr: dw_outbox_oldest_pending_age_seconds > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "An outbox event has waited more than 30 minutes"
          description: >
            The oldest pending outbox event dw-worker handles is
            {{ $value | humanizeDuration }} old.

      - alert: DwDeliveryExhausted
        # Sales ticket 84. A notification a channel gave up on after every
        # retry: the chat provider or the push service kept failing. Only
        # this end is counted; a person who unlinked or whose phone dropped
        # the subscription is not the system failing. The counter starts at
        # 0 per channel, so the first one counts.
        expr: increase(dw_channel_delivery_exhausted_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.channel }}: a notification was given up on after every retry"
          description: >
            {{ $labels.channel }} gave up on {{ $value | humanize }} notification(s)
            in the last hour; the inbox still holds each one.

      - alert: DwBravoWriteNeedsAPerson
        # Sales ticket 84. A Bravo write the gateway could not settle cleanly:
        # sent with no answer, written with a read-back that differs, or
        # claimed and left 15 minutes. The count never goes back down by
        # itself (a stale claim that settles later stays counted, migration
        # 5895c4d8683e), so a rise is a new one; the rule fires on it and
        # clears after 30 minutes. The PIC sees each one on its case.
        #
        # `notice: event`: clearing fixes nothing, the write is still in
        # doubt. Alertmanager sends no resolved notice for it and the host's
        # watchdog mails no "OK again" (alertmanager.yml.template,
        # host-watchdog.ps1 section 5d).
        expr: delta(dw_bravo_writes_needing_a_person[30m]) > 0
        labels:
          severity: warning
          notice: event
        annotations:
          summary: "A Bravo write needs a person to check Bravo"
          description: >
            The gateway's ledger now holds {{ with query "dw_bravo_writes_needing_a_person" }}{{ . | first | value }}{{ end }}
            write(s) a person was asked to check. Open the case and
            read the SO in Bravo before anything else is written to it.
            This alert clears by itself; the write does not.

      - alert: Watchdog
        # Sales ticket 84. Always firing, on purpose: the host's relay reads
        # Alertmanager every few minutes and treats this one missing as the
        # alert pipeline down (Prometheus, its rules, or Alertmanager), which
        # an empty list of alerts could not tell apart from "all is well".
        # Alertmanager routes it to no receiver.
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "The alert pipeline is running"
          description: "Always firing; its absence means alerts cannot reach anyone."
