# promtool unit tests for alerts.yml (Sales ticket 84). Run from the repo root:
#   docker run --rm -v "$PWD/infra/prometheus:/p" --entrypoint promtool \
#     prom/prometheus:v3.6.0 test rules /p/alerts.test.yml
# Each rule here is tested where only running it can say what it does: a
# series absent until its first sample, a comparison across two series that
# must match label for label, a `for:` window.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # DwLaneStale: the gauge is a unix time, so at the test's time t a lane
  # whose last clean tick was at 0 is t seconds stale.
  - interval: 1m
    input_series:
      # Hourly, and never once clean since the worker started at 0.
      - series: 'dw_lane_last_ok_timestamp_seconds{job="dw-worker",lane="partitions"}'
        values: "0x300"
      - series: 'dw_lane_interval_seconds{job="dw-worker",lane="partitions"}'
        values: "3600x300"
      # Every 5 s, and clean on every tick (the value follows the clock).
      - series: 'dw_lane_last_ok_timestamp_seconds{job="dw-worker",lane="sales_inbox"}'
        values: "0+60x300"
      - series: 'dw_lane_interval_seconds{job="dw-worker",lane="sales_inbox"}'
        values: "5x300"
      # Every 5 s, clean until minute 10, then failing.
      - series: 'dw_lane_last_ok_timestamp_seconds{job="dw-worker",lane="sales_mail_drop"}'
        values: "0+60x10 600x290"
      - series: 'dw_lane_interval_seconds{job="dw-worker",lane="sales_mail_drop"}'
        values: "5x300"
    alert_rule_test:
      # Three hourly intervals have not passed yet for partitions; the lane
      # failing since minute 10 is long past its 30-minute floor.
      - eval_time: 2h50m
        alertname: DwLaneStale
        exp_alerts:
          - exp_labels: { job: dw-worker, lane: sales_mail_drop, severity: warning }
            exp_annotations:
              summary: "Worker lane sales_mail_drop has not finished a clean tick"
              description: >
                sales_mail_drop last finished a tick without an error 2h 40m 0s ago.
                Its log in dw-worker says why ("consumer sales_mail_drop failed").
      # Past three intervals, and past the 5-minute `for:`.
      - eval_time: 3h10m
        alertname: DwLaneStale
        exp_alerts:
          - exp_labels: { job: dw-worker, lane: partitions, severity: warning }
            exp_annotations:
              summary: "Worker lane partitions has not finished a clean tick"
              description: >
                partitions last finished a tick without an error 3h 10m 0s ago.
                Its log in dw-worker says why ("consumer partitions failed").
          - exp_labels: { job: dw-worker, lane: sales_mail_drop, severity: warning }
            exp_annotations:
              summary: "Worker lane sales_mail_drop has not finished a clean tick"
              description: >
                sales_mail_drop last finished a tick without an error 3h 0m 0s ago.
                Its log in dw-worker says why ("consumer sales_mail_drop failed").
      # A 5-second lane stale for 20 minutes is under the 30-minute floor.
      - eval_time: 30m
        alertname: DwLaneStale
        exp_alerts: []
