# Loki, one process, on the plant's own disk (Đạt, 2026-11-05: nothing in a
# cloud). Holds what the containers write to stdout/stderr, collected by
# Alloy (infra/alloy/config.alloy). No auth: Loki sits on dw-internal with no
# published port, and Grafana is the only reader.
# Started with -config.expand-env=true, so ${VAR:-default} below is read from
# the container's environment.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # How long a log line is kept: Proterial's call (question 40 of
  # docs/proterial/Cau-hoi-Proterial-DW1-DW2.xlsx); 30 days until then.
  retention_period: ${DW_LOKI_RETENTION:-720h}
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  # Without this, retention_period above is declared and nothing deletes.
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
