# The `clamav` service with its port published on the loopback, for the
# integration suite only (`packages/python/dw_sales/tests/integration/
# test_clamd.py`, DW_TEST_CLAMD=127.0.0.1:3310). Layered over
# docker-compose.yml, so the image, its digest and its config have one owner:
#
#   docker compose -f infra/compose/docker-compose.yml \
#     -f infra/compose/docker-compose.scan-test.yml --profile scan up -d --wait clamav
#
# Never in a deployed overlay: there clamd is reachable on `dw-scan` only.
services:
  clamav:
    ports:
      - "127.0.0.1:3310:3310"
    # Published ports need a network that is not internal.
    networks: [dw-scan, dw-edge]
