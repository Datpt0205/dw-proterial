# clamd for DW1's malware scan (dw_sales ticket 25), mounted read-only over
# the image's own config so the container runs with a read-only root, no
# capabilities and as the image's clamav user (100:101), skipping the image's
# init script, which chowns and writes under /etc, /run and /var.
#
# Signatures come with the image (clamav/clamav:<version>, pinned by digest
# in docker-compose.yml) and are never fetched: no freshclam, no egress. A
# newer signature set is a newer image, scanned and pinned like any other.

# Logs go to stderr, which compose keeps; nothing is written in the container.
Foreground yes
LogTime yes
LogVerbose no

DatabaseDirectory /var/lib/clamav
# No reloads: the databases never change inside a running container, and a
# reload would hold two copies of them in memory for its duration.
SelfCheck 0
ConcurrentDatabaseReload no

# TCP only, on the scan network (compose `dw-scan`), which holds the API and
# the worker and nothing else: clamd's port also takes SHUTDOWN and RELOAD.
TCPSocket 3310
TCPAddr 0.0.0.0

# The intake's own cap (sales_order_rules intake.max_attachment_bytes, 10 MB)
# is under this, so every file the intake accepts can be scanned whole.
StreamMaxLength 25M
MaxThreads 4
