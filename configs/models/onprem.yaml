schema_version: "1.0"
profile_id: onprem
routing_policy_version: "1.4.0"
# A model server the deployment runs itself, for a step whose input must not
# leave it: DW1 reading a customer's item description (dw_sales ADR 0005).
# Reached as provider `onprem`, at DW_ONPREM_MODEL_BASE_URL (any server
# speaking /v1/chat/completions: Strata now, Ollama before it), apart from the
# gateway every other profile uses, with DW_ONPREM_MODEL_API_KEY when the
# server asks for one. On a developer machine:
#   DW_ONPREM_MODEL_BASE_URL=http://localhost:11434/v1
# Localhost is admitted only outside a deployed profile; a deployed server is
# named in DW_API_OUTBOUND_ALLOWED_HOSTS like any other host.
#
# 1.3.0: every chat route on Qwen3.8-Flash-Next (Q2_0) served by Strata, the
# one model of both DWs (docs/adr/0025). Strata lists it as
# `qwen3.8-flash-next-q2_0`, context 262144, text only. Measured 2026-10-26 on
# an RTX 3090 (six DW1 sets, every bar passed) and 2026-11-16 on Giang's home
# lab (ticket 01's comments); neither is the plant's RTX PRO 4000, so nothing
# here is attested yet. Before 1.3.0 every route ran Qwen3.5-9B Q4_K_M on
# Ollama (`qwen3.5-9b-dw`, num_ctx 8192).
#
# Thinking OFF on every route (`reasoning_effort: none`). Measured 2026-10-12
# on a GTX 1080 8 GB with Qwen3.5-9B: about 80 s and 1,400 tokens for a
# one-line extraction with thinking on, about 4 s without; 2026-11-16 on
# Strata, a JSON answer in about 1 s without. Thinking off is also what makes
# the model miss a field more often, which is why code re-parses every number
# from the span the model points at and computes coverage itself.
#
# NO fallback route on purpose: a step on this profile is one whose input may
# not go to an external model, so when the server is down the step degrades
# to a person rather than to someone else's model. No second model either
# (ADR 0025): an outage of Strata means work by hand, not worse answers.
#
# Timeouts: Strata unloads the model when idle and the first call after that
# took about 32 s (2026-11-16), well inside every route's timeout below;
# `scripts/warm_model.py` keeps it loaded.
#
# max_input_tokens stays 6000. It was the old server's context (num_ctx 8192)
# less room for the answer; Strata's is 262144, and a 26k-token prompt
# answered in about 10 s on 2026-11-16. It is not raised because nothing
# measured needs it: the DW1 sets were measured at this cut, and a larger one
# changes how a step splits what it reads, which those sets did not measure.
# Raise it with the set that needs it.
#
# 1.4.0: the structured route asks for each token's log-probability
# (`logprobs: true`), so a DW1 step scores what it read in the same call and
# a result may apply itself under a measured error rate (dw_sales ADR 0015,
# ticket 44). Measured 2026-11-16 on Strata: `logprobs: true` returns each
# token's log-probability beside a strict JSON-schema answer
# (`docs/research/2026-11-16-less-human-review.md`, "Measured after writing").
#
# Unpriced: the server is the deployment's own, so a run is bounded by the
# token ceiling below, not by cost.
structured_extraction:
  provider: onprem
  model: qwen3.8-flash-next-q2_0
  timeout_seconds: 120
  reasoning_effort: none
  temperature: 0.0
  # The most input one call is sent, prompt included (why 6000: above). A DW1
  # step cuts or splits what it reads under this (tickets 29, 31), so no call
  # is refused as too long and retried for nothing.
  max_input_tokens: 6000
  logprobs: true
reasoning:
  provider: onprem
  model: qwen3.8-flash-next-q2_0
  timeout_seconds: 180
  reasoning_effort: none
# 1.2.0: the tool-calling route, for a reading that looks things up with
# read-only tools before it answers (dw_sales ADR 0012; the thread agent,
# tickets 30 and 31). The same model and server as the structured route,
# thinking off, no fallback: a turn that cannot reach it falls back to the
# step's one-call reading, then to a person. Measured 2026-11-15 on Ollama
# (qwen3.5-9b-dw, GTX 1080 8 GB): OpenAI-style tool calls over
# /v1/chat/completions, about 3 s per warm call; on Strata since 1.3.0. The
# turn's own ceiling on calls, tokens and time is the step's
# (`dw_sales.application.thread_agent`).
chat:
  provider: onprem
  model: qwen3.8-flash-next-q2_0
  timeout_seconds: 120
  reasoning_effort: none
  temperature: 0.0
  max_input_tokens: 6000
# 1.1.0: the deployment's own server embeds too, so an on-premises deployment
# (infra/onprem) runs knowledge and memory with no call out of the plant. The
# builder (`dw_knowledge.adapters.embedding_factory`) sends a route with
# provider `onprem` to DW_ONPREM_MODEL_BASE_URL, never to the gateway.
# bge-m3 (Ollama `bge-m3:567m`, 1024 dimensions, multilingual including
# Vietnamese). A collection is built at this width: switching a deployment
# onto this profile means a new QDRANT_COLLECTION and a reindex. Unchanged in
# 1.3.0: Strata serves no embedding model (its /v1/models lists only the chat
# model, 2026-11-16), so bge-m3 still needs a server at this base URL; which
# one is ticket 01's on-prem compose.
embedding:
  provider: onprem
  model: bge-m3:567m
  dimensions: 1024
  timeout_seconds: 120
budgets:
  max_input_tokens_per_run: 60000
  max_cost_usd_per_run: 0.01
