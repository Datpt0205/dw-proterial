# Danh sách đăng nhập demo, CHỈ cho phát triển cục bộ: router /api/v1/dev/*
# không bao giờ được mount ở profile uat/production. UUID là uuid5 deterministic khớp seed
# (dw_platform.testing.seed_env, SEED_NAMESPACE); backend vẫn xác minh membership
# trong DB trên mọi request — roster này chỉ là tiện ích đăng nhập demo.
#
# Mỗi người ở đây có trong seed, cùng tên hiển thị và cùng vai trò: role nền tảng
# từ dw_platform.testing.seed_env, role sales_* từ dw_sales.testing.seed_personas
# (permission set nằm trong description). Người và tên đều là giả lập.
# dw_sales/tests/unit/test_demo_roster.py kiểm tra điều này.
