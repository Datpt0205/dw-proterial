schema_version: "1.0"
policy_id: purchasing_rules
version: "1.1.0"

# MOCK. The rules DW2 (Mua hàng) runs under until Proterial's own arrive as
# the tenant's version of this document, stored at runtime and never as an
# edit to this file (ADR 0013 decision 5). Validated by
# `dw_purchasing.domain.rules.PurchasingRules`; a case stamps the version it
# was received under, and the approver its check sent it to.
#
# 1.1.0 adds `approval` (DW02 function 2). Every figure is fictional.

# What a purchase request must carry to be received (DW02 function 1).
pr_form:
  # Beyond what every request has (number, department, requester, lines):
  # budget_code, need_by (for the request or every line),
  # estimated_unit_price (every line).
  required: [budget_code]
  max_lines: 50
  currencies: [VND, USD, JPY]
  # A request that names no currency is in this one.
  default_currency: VND

# The company's mail domains: only a sender from one of them, verified by the
# mail system (SPF, DKIM and DMARC pass), may be a requester. The mock
# company's domain.
internal_domains: [seller.example]

# Who approves a request, by its amount after the cross-check (the sum of
# quantity times each line's reference price: a valid quotation, else the
# last price paid, else the requester's estimate).
approval:
  currency: VND
  tiers:
    - up_to: 20000000
      scope: purchasing.approve.tier1
      label: Trưởng phòng Mua hàng
    - up_to: 200000000
      scope: purchasing.approve.tier2
      label: Giám đốc nhà máy
    - up_to: null
      scope: purchasing.approve.tier3
      label: Tổng giám đốc
  # An estimate this far above the reference price is a finding.
  price_tolerance_percent: 10
  # These findings send a request to the last tier whatever its amount.
  escalate: [no_reference_price, over_budget, budget_unknown, currency_mismatch]
