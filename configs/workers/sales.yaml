schema_version: "1.0"
# DW1, Đơn hàng & Báo giá (Proterial Sales): dw_sales.workflows.graph.
# The id and version are the ones DW1's events carry
# (dw_sales.application.support.DW1_WORKER_ID / DW1_WORKER_VERSION);
# test_dw1_worker.py holds them together.
worker_id: sales-dw1
worker_version: "1.0.0"
domain: sales
graph_version: "1.0.0"
# DW1 reads documents with deterministic parsers, and where a tenant's rules
# turn a step on, through a local model under dw_sales ADR 0005 (typed output
# code verifies, flagged for a person, degrading to a person). 1.1.0 holds the
# first such prompt, sales.description_attributes@1.0.0 (ticket 28).
prompt_bundle_version: "1.1.0"
# No toolset: DW1 offers a model no tool at all, outbound or otherwise, and
# its model step's port has no way to offer one. That is how ADR 0007 (SEC02,
# a turn that reads a document gets no outbound tool) holds for a worker whose
# every run reads customer mail; test_dw1_runtime.py turns red otherwise.
toolset_version: null
policy_version: "1.0.0"
memory_policy_version: "1.0.0"
# The profile every DW1 model step runs on (dw_sales ADR 0005): the
# deployment's own model server, thinking off, no external fallback
# (configs/models/onprem.yaml). The composition root reads it from here; a
# process with no such server (no DW_ONPREM_MODEL_BASE_URL) calls no model.
default_model_profile: onprem
supported_channels: [web]
# A person makes every decision: the quotation approval and the cross-check
# pause the run whatever the level (the graph interrupts unconditionally), and
# auto-confirmation (A3) is out of this slice.
autonomy_level: A1
