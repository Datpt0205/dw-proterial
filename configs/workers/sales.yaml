schema_version: "1.0"
# DW1, Đơn hàng & Báo giá (Proterial Sales): dw_sales.workflows.graph.
# The id and version are the ones DW1's events carry
# (dw_sales.application.support.DW1_WORKER_ID / DW1_WORKER_VERSION);
# test_dw1_worker.py holds them together.
worker_id: sales-dw1
worker_version: "1.0.0"
domain: sales
graph_version: "1.0.0"
# DW1 reads documents with deterministic parsers, and where a tenant's rules
# turn a step on, through a local model under dw_sales ADR 0005 (typed output
# code verifies, flagged for a person, degrading to a person). 1.1.0 holds the
# first such prompt, sales.description_attributes@1.0.0 (ticket 28); 1.2.0
# the thread agent's, sales.thread_agent@1.0.0 (tickets 30 and 31); 1.3.0
# DW1's agent with skills, sales.dw1_agent@1.0.0 (dw_sales ADR 0014, ticket 40);
# 1.4.0 sales.description_attributes@1.1.0, which shows a reading the
# tenant's decided lines most like it (ticket 43); 1.5.0 its 1.2.0, which
# shows a decided line's confirmed reading as the answer it was; 1.6.0
# sales.po_body_extraction@1.2.0, shown the customer's decided mail-PO values;
# 1.7.0 sales.question_intent@1.4.0, a decision's flag from earlier turns;
# 1.8.0 its 1.5.0, a case given to a colleague named in its conversation;
# 1.9.0 its 1.6.0, an SO line's cancel asked for in a case's conversation.
prompt_bundle_version: "1.9.0"
# Read-only tools for the thread agent's turn only (dw_sales ADR 0012, the
# amendment of ADR 0005 decision 5): every tool `none`, bound by code to the
# thread's customer, and no tool that writes, sends or approves, which is how
# ADR 0007 (SEC02, a turn that reads a document gets no outbound tool) holds
# for a worker whose every run reads customer mail. Every one-call step still
# offers none. test_dw1_runtime.py turns red on a pin that is not `none`.
# 1.1.0 adds `sales.read_skill`, offered only to the turn served DW1's skills
# (dw_sales ADR 0014, ticket 40).
toolset_version: "1.1.0"
policy_version: "1.0.0"
memory_policy_version: "1.0.0"
# The profile every DW1 model step runs on (dw_sales ADR 0005): the
# deployment's own model server, thinking off, no external fallback
# (configs/models/onprem.yaml). The composition root reads it from here; a
# process with no such server (no DW_ONPREM_MODEL_BASE_URL) calls no model.
default_model_profile: onprem
# Where a run may start: `web` for a person on the portal, `sales_inbox` for
# the mailbox lane (`InboxLane.channel_of`). The runner refuses any other.
supported_channels: [web, sales_inbox]
# The level the runner holds DW1's runs to (`langgraph_runner`): at A1 a tool
# call goes ahead only when it has no side effect (`dw_agent_runtime.autonomy`),
# and every DW1 tool is `none`. It bounds nothing else. The graph's pauses (the
# quotation approval, the cross-check) do not read it, and the lanes that apply
# a step by themselves run outside the runner: `sales_auto_apply` (ADR 0015,
# ticket 44), `sales_cross_check_on_match` (ticket 81, off unless the tenant's
# order rules turn `cross_check_on_match` on) and the follow-ups' implied
# acceptance (ticket 82). Each is bounded by code and the tenant's rules
# instead, never by this field: auto-apply by the tier code gives each step
# (`dw_sales.domain.autonomy.STEP_TIERS`) and the error and audit share in
# `sales_order_rules.autonomy`, the cross-check on match by the hand-off error
# and audit share there, implied acceptance by `sales_followups`'
# `implied_acceptance.record`.
autonomy_level: A1
