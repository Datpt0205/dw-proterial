schema_version: "1.0"
# DW1's read-only tool for reading a thread message (dw_sales ADR 0012,
# tickets 30 and 31; `dw_sales.application.thread_tools`). The customer,
# tenant and workspace it reads are bound from the run by code, never an
# argument.
name: sales.case_snapshot
version: "1.0.0"
summary: "The cases this thread is about, as DW1 holds them now: the order or request for quotation, its numbers, its status and its lines."
when_to_use: "You need to know what the message's words refer to: which line, what quantity or date was ordered or confirmed, what Sales is waiting for."
when_not_to_use: "The message is understood without it."
returns: "cases: each with kind, numbers, status, lines (line_no, customer_item_code, prv_code, quantity, unit, requested_date, confirmed_dates, pc_deliveries) and waiting_on_pc_since."
required_scopes: [sales.inbox.process]
# Reads only: nothing is written, sent or approved (dw_sales ADR 0012).
side_effect_level: none
approval_policy: never
timeout_seconds: 10
max_retries: 1
idempotent: true
# The customer's own records and words, read for their own thread.
data_classification: [confidential]
