schema_version: "1.0"
copy_id: sales_emails
version: "1.8.0"
mock: true
description: >-
  The words of every draft DW1 prepares for Sales (dw_sales ticket 06), keyed
  by artifact kind and language. MOCK: fictional wording for the demo seller on
  seller.example. The customer's own wording arrives only as a tenant version
  of this copy (spec decision 14), never in this file. Read by
  dw_sales.application.artifact_content.SalesEmailCopy.
  1.1.0 (ticket 20): the correction request names a PO typed in a legacy
  Vietnamese font (TCVN3 or VNI), which the customer is asked to send again in
  Unicode. Nothing else changed from 1.0.0.
  1.2.0 (ticket 35): the order confirmation lists a line the PO splits over
  several delivery schedules schedule by schedule, each quantity with the date
  Sales confirmed for it (`schedule`, `schedules`). Nothing else changed.
  1.3.0 (ticket 29): the answer to a customer's change of an order already in
  Bravo, once PC answered: `change_can_do_draft` (BA step 6-DW4, PC can do
  what was asked) and `change_options_draft` (6-DW3, PC proposes otherwise).
  Which one is drafted is code's comparison of PC's dates with the dates
  asked. Nothing else changed.
  1.4.0 (ticket 32): `question_answer`, the example letter of an answer to a
  customer's question about an order. No template draft is drawn from it:
  DW1's model words the answer (`${answer}`) from facts code gives, with
  every figure checked, beside it for a person to send. The other kinds'
  letters are the examples of the model's wording of those drafts. Nothing
  else changed.
  1.5.0 (ticket 10): `internal_change_notice`, the notice to the customer of
  Proterial's own change of a confirmed order (the BA's step 6.1B: PC moved,
  split or cut lines for overcapacity, NG or short stock): each changed line
  with the deliveries PC now gives it, its quantity where PC cut it, and the
  reason in the company's words (`reason.<code>`). No price, no amount.
  Nothing else changed.
  1.6.0 (ticket 10): the same notice names a line PC cancelled whole
  (`cancelled`, in place of its deliveries). Nothing else changed.
  1.7.0 (ticket 81): the confirmation names an order whose cross-check DW
  passed on Bravo's matching read-back as checked so, never by a person's
  name (`checked_on_read_back`). Nothing else changed.
  1.8.0 (DW1 review, 2026-11-28): one tone-mark style, the old one, as every
  screen writes it: "hủy cả dòng" (`cancelled`). Nothing else changed.

# Code fills every ${value}: numbers, dates, codes and names come from the
# case and master data, never from these words. A template naming a value the
# draft does not have refuses to render; a (kind, language) with no template
# refuses too, and never falls back to another language. A draft to the
# customer is in the customer's language (vi, en, ja); a note to Design is in
# Vietnamese.

# Who a customer draft is from, until the customer answers (requirements doc
# §3.1): `drafting_pic`, the PIC who drafts it and sends it from their own
# mailbox, or `shared_sales`. Reply-To is always the shared Sales address.
sender:
  from: drafting_pic
  shared_sales:
    address: sales@seller.example
    display_name: "Phòng Kinh doanh (demo)"

emails:
  # ---------------------------------------------------------------- orders --
  confirmation_draft:
    vi:
      subject: "Xác nhận đơn hàng ${po_no} (lần sửa ${revision})"
      line: "- Dòng ${line_no}: ${customer_item_code} (${prv_code}) ${description}: ${quantity} ${uom} × ${unit_price} ${currency}, ngày giao xác nhận ${confirmed_date}"
      body: |-
        Kính gửi ${customer_name},

        Chúng tôi xác nhận đơn hàng ${po_no} (lần sửa ${revision}, ngày ${po_date}), số đơn bán ${bravo_so_no}:

        ${lines}

        Người phụ trách: ${pic}
        Người kiểm tra: ${checker}

        Trân trọng.
      words:
        no_cross_check: "(không yêu cầu kiểm chéo)"
        checked_on_read_back: "(đối chiếu tự động với hệ thống)"
        schedules: "theo ${count} đợt: ${schedules}"
        schedule: "${quantity} ${uom} ngày ${confirmed_date}"
    en:
      subject: "Order confirmation ${po_no} (revision ${revision})"
      line: "- Line ${line_no}: ${customer_item_code} (${prv_code}) ${description}: ${quantity} ${uom} × ${unit_price} ${currency}, confirmed delivery ${confirmed_date}"
      body: |-
        Dear ${customer_name},

        We confirm your order ${po_no} (revision ${revision}, dated ${po_date}), our sales order ${bravo_so_no}:

        ${lines}

        Prepared by: ${pic}
        Checked by: ${checker}

        Best regards.
      words:
        no_cross_check: "(no second check required)"
        checked_on_read_back: "(checked automatically against our system)"
        schedules: "in ${count} deliveries: ${schedules}"
        schedule: "${quantity} ${uom} on ${confirmed_date}"
    ja:
      subject: "ご注文確認 ${po_no}（改訂 ${revision}）"
      line: "- ${line_no}行目: ${customer_item_code}（${prv_code}）${description}: ${quantity} ${uom} × ${unit_price} ${currency}、確定納期 ${confirmed_date}"
      body: |-
        ${customer_name} 御中

        ご注文 ${po_no}（改訂 ${revision}、${po_date} 付）を、弊社受注番号 ${bravo_so_no} にて確認いたしました。

        ${lines}

        担当: ${pic}
        確認: ${checker}

        よろしくお願いいたします。
      words:
        no_cross_check: "（ダブルチェック対象外）"
        checked_on_read_back: "（システムと自動照合済み）"
        schedules: "${count}回に分納: ${schedules}"
        schedule: "${confirmed_date} ${quantity} ${uom}"

  correction_request:
    vi:
      subject: "Đề nghị điều chỉnh đơn hàng ${po_no} (lần sửa ${revision})"
      line: "- ${line}: ${finding}. Trên PO: ${po_value}; giá trị đúng: ${expected}; căn cứ: ${basis} (${anchor})"
      body: |-
        Kính gửi ${customer_name},

        Khi kiểm tra đơn hàng ${po_no} (lần sửa ${revision}, ngày ${po_date}), chúng tôi thấy các điểm sau cần quý khách điều chỉnh:

        ${lines}

        Rất mong quý khách gửi lại PO đã điều chỉnh.

        Trân trọng.
      words:
        line: "Dòng ${line_no}"
        whole_po: "Toàn bộ PO"
        finding.code_unmapped: "Mã hàng chưa có trong danh mục quy đổi"
        finding.code_ambiguous: "Mã hàng ứng với nhiều sản phẩm"
        finding.price_mismatch: "Đơn giá khác báo giá"
        finding.currency_mismatch: "Tiền tệ khác báo giá"
        finding.uom_mismatch: "Đơn vị tính khác"
        finding.quotation_missing: "Chưa có báo giá còn hiệu lực"
        finding.lme_band_mismatch: "Giá không theo mức LME của tháng"
        finding.moq_violation: "Số lượng dưới mức đặt hàng tối thiểu"
        finding.pack_multiple: "Số lượng không chẵn quy cách đóng gói"
        finding.line_total_mismatch: "Tổng các dòng không khớp hoặc thiếu dòng"
        finding.value_uncertain: "Giá trị trên PO không đọc rõ"
        finding.legacy_encoding: "PO được gõ bằng font tiếng Việt cũ (TCVN3/VNI); xin gửi lại bản dùng font Unicode"
        basis.quotation: "báo giá ${quote_no}"
        basis.no_quotation: "không có báo giá còn hiệu lực"
        basis.item: "danh mục hàng (${prv_code})"
        basis.convert_list: "danh mục quy đổi mã hàng"
        basis.document: "nội dung PO"
    en:
      subject: "Request to correct order ${po_no} (revision ${revision})"
      line: "- ${line}: ${finding}. On the PO: ${po_value}; expected: ${expected}; checked against: ${basis} (${anchor})"
      body: |-
        Dear ${customer_name},

        While checking your order ${po_no} (revision ${revision}, dated ${po_date}) we found the following points that need your correction:

        ${lines}

        We would appreciate a corrected PO.

        Best regards.
      words:
        line: "Line ${line_no}"
        whole_po: "Whole PO"
        finding.code_unmapped: "Item code not in our code list"
        finding.code_ambiguous: "Item code matches more than one product"
        finding.price_mismatch: "Unit price differs from our quotation"
        finding.currency_mismatch: "Currency differs from our quotation"
        finding.uom_mismatch: "Unit of measure differs"
        finding.quotation_missing: "No valid quotation"
        finding.lme_band_mismatch: "Price does not follow the month's LME band"
        finding.moq_violation: "Quantity below the minimum order quantity"
        finding.pack_multiple: "Quantity is not a whole number of packs"
        finding.line_total_mismatch: "Line total does not match or a line is missing"
        finding.value_uncertain: "A value on the PO cannot be read clearly"
        finding.legacy_encoding: "The PO is typed in a legacy Vietnamese font (TCVN3/VNI); please send it again in a Unicode font"
        basis.quotation: "quotation ${quote_no}"
        basis.no_quotation: "no valid quotation"
        basis.item: "item master (${prv_code})"
        basis.convert_list: "customer code list"
        basis.document: "the PO itself"
    ja:
      subject: "ご注文 ${po_no}（改訂 ${revision}）修正のお願い"
      line: "- ${line}: ${finding}。注文書: ${po_value}／正しい値: ${expected}／根拠: ${basis}（${anchor}）"
      body: |-
        ${customer_name} 御中

        ご注文 ${po_no}（改訂 ${revision}、${po_date} 付）を確認したところ、以下の点について修正をお願いいたします。

        ${lines}

        修正後の注文書をお送りいただけますと幸いです。

        よろしくお願いいたします。
      words:
        line: "${line_no}行目"
        whole_po: "注文書全体"
        finding.code_unmapped: "品番が品番対照表にありません"
        finding.code_ambiguous: "品番が複数の製品に該当します"
        finding.price_mismatch: "単価がお見積りと異なります"
        finding.currency_mismatch: "通貨がお見積りと異なります"
        finding.uom_mismatch: "単位が異なります"
        finding.quotation_missing: "有効なお見積りがありません"
        finding.lme_band_mismatch: "単価が当月のLME区分に沿っていません"
        finding.moq_violation: "数量が最小発注数量未満です"
        finding.pack_multiple: "数量が梱包単位の倍数ではありません"
        finding.line_total_mismatch: "合計が一致しないか、行が欠けています"
        finding.value_uncertain: "注文書の値が判読できません"
        finding.legacy_encoding: "注文書が旧ベトナム語フォント（TCVN3/VNI）で入力されています。Unicodeフォントで再送してください"
        basis.quotation: "見積書 ${quote_no}"
        basis.no_quotation: "有効な見積書なし"
        basis.item: "品目マスタ（${prv_code}）"
        basis.convert_list: "品番対照表"
        basis.document: "注文書の記載"

  cannot_supply_draft:
    vi:
      subject: "Về đơn hàng ${po_no}: chúng tôi không thể cung cấp"
      line: "- Dòng ${line_no}: ${customer_item_code} ${description}: ${quantity} ${uom}"
      body: |-
        Kính gửi ${customer_name},

        Rất tiếc chúng tôi không thể cung cấp đơn hàng ${po_no} (lần sửa ${revision}, ngày ${po_date}):

        ${lines}

        Mong quý khách thông cảm.

        Trân trọng.
    en:
      subject: "Your order ${po_no}: we are unable to supply"
      line: "- Line ${line_no}: ${customer_item_code} ${description}: ${quantity} ${uom}"
      body: |-
        Dear ${customer_name},

        We regret that we are unable to supply your order ${po_no} (revision ${revision}, dated ${po_date}):

        ${lines}

        Thank you for your understanding.

        Best regards.
    ja:
      subject: "ご注文 ${po_no} につきまして（供給不可のご連絡）"
      line: "- ${line_no}行目: ${customer_item_code} ${description}: ${quantity} ${uom}"
      body: |-
        ${customer_name} 御中

        誠に恐れ入りますが、ご注文 ${po_no}（改訂 ${revision}、${po_date} 付）は弊社にて供給いたしかねます。

        ${lines}

        何卒ご了承くださいますようお願い申し上げます。

  # The answer to a customer's change of an order in Bravo (ticket 29). Code
  # decides which: every date PC gives is the date asked (6-DW4), or not
  # (6-DW3). `${deliveries}` lists PC's deliveries of the line, each a
  # `delivery`; `${asked}` is what the customer asked, an `asked`.
  change_can_do_draft:
    vi:
      subject: "Xác nhận thay đổi đơn hàng ${po_no}"
      line: "- Dòng ${line_no}: ${customer_item_code}: ${deliveries}"
      body: |-
        Kính gửi ${customer_name},

        Về đề nghị thay đổi đơn hàng ${po_no} (số đơn bán ${bravo_so_no}), chúng tôi đáp ứng được như quý khách đề nghị:

        ${lines}

        Mong quý khách xác nhận để chúng tôi cập nhật đơn hàng.

        Trân trọng.
      words:
        delivery: "${quantity} ${uom} ngày ${date}"
    en:
      subject: "Change to order ${po_no} confirmed"
      line: "- Line ${line_no}: ${customer_item_code}: ${deliveries}"
      body: |-
        Dear ${customer_name},

        Regarding your requested change to order ${po_no} (our sales order ${bravo_so_no}), we can deliver as you asked:

        ${lines}

        Please confirm, and we will update the order.

        Best regards.
      words:
        delivery: "${quantity} ${uom} on ${date}"
    ja:
      subject: "ご注文 ${po_no} 変更のご回答"
      line: "- ${line_no}行目: ${customer_item_code}: ${deliveries}"
      body: |-
        ${customer_name} 御中

        ご注文 ${po_no}（弊社受注番号 ${bravo_so_no}）の変更のご依頼につきまして、ご希望どおり対応可能です。

        ${lines}

        ご確認いただけましたら、受注を更新いたします。

        よろしくお願いいたします。
      words:
        delivery: "${date} ${quantity} ${uom}"

  change_options_draft:
    vi:
      subject: "Về đề nghị thay đổi đơn hàng ${po_no}"
      line: "- Dòng ${line_no}: ${customer_item_code}: quý khách đề nghị ${asked}; chúng tôi có thể giao ${deliveries}"
      body: |-
        Kính gửi ${customer_name},

        Về đề nghị thay đổi đơn hàng ${po_no} (số đơn bán ${bravo_so_no}), chúng tôi chưa đáp ứng được đúng như đề nghị. Khả năng giao của chúng tôi như sau:

        ${lines}

        Mong quý khách cho biết đồng ý phương án trên, hay giữ nguyên đơn hàng như cũ.

        Trân trọng.
      words:
        delivery: "${quantity} ${uom} ngày ${date}"
        asked: "${quantity} ${uom} ngày ${date}"
    en:
      subject: "Your requested change to order ${po_no}"
      line: "- Line ${line_no}: ${customer_item_code}: you asked for ${asked}; we can deliver ${deliveries}"
      body: |-
        Dear ${customer_name},

        Regarding your requested change to order ${po_no} (our sales order ${bravo_so_no}), we cannot deliver exactly as asked. We can offer:

        ${lines}

        Please let us know whether you accept this, or keep the order as it was.

        Best regards.
      words:
        delivery: "${quantity} ${uom} on ${date}"
        asked: "${quantity} ${uom} on ${date}"
    ja:
      subject: "ご注文 ${po_no} 変更のご依頼につきまして"
      line: "- ${line_no}行目: ${customer_item_code}: ご希望 ${asked}／弊社ご提案 ${deliveries}"
      body: |-
        ${customer_name} 御中

        ご注文 ${po_no}（弊社受注番号 ${bravo_so_no}）の変更のご依頼につきまして、ご希望どおりの対応が難しく、以下のとおりご提案いたします。

        ${lines}

        ご提案にご同意いただけるか、元のご注文のままとされるか、ご指示ください。

        よろしくお願いいたします。
      words:
        delivery: "${date} ${quantity} ${uom}"
        asked: "${date} ${quantity} ${uom}"

  # Proterial's own change of a confirmed order (ticket 10): what PC now
  # delivers, line by line, and why in the company's words. `${cut}` is the
  # `cut` word on a line PC cut, and empty on any other.
  internal_change_notice:
    vi:
      subject: "Thông báo thay đổi lịch giao đơn hàng ${po_no}"
      line: "- Dòng ${line_no}: ${customer_item_code}: ${deliveries}${cut}"
      body: |-
        Kính gửi ${customer_name},

        Chúng tôi xin thông báo: ${reason}, lịch giao của đơn hàng ${po_no} (số đơn bán ${bravo_so_no}) thay đổi như sau:

        ${lines}

        Rất mong quý khách thông cảm. Nếu lịch giao mới chưa phù hợp, xin quý khách phản hồi để chúng tôi sắp xếp.

        Trân trọng.
      words:
        delivery: "${quantity} ${uom} ngày ${date}"
        cut: " (số lượng còn ${quantity} ${uom})"
        cancelled: "hủy cả dòng, không giao"
        reason.overcapacity: "do kế hoạch sản xuất vượt công suất"
        reason.ng: "do một phần hàng chưa đạt kiểm tra chất lượng"
        reason.short_stock: "do thiếu nguyên vật liệu"
        reason.other: "do thay đổi kế hoạch sản xuất"
    en:
      subject: "Change of delivery schedule for order ${po_no}"
      line: "- Line ${line_no}: ${customer_item_code}: ${deliveries}${cut}"
      body: |-
        Dear ${customer_name},

        We regret to inform you that ${reason}, the deliveries of order ${po_no} (our sales order ${bravo_so_no}) change as follows:

        ${lines}

        We apologise for the inconvenience. If the new schedule does not suit you, please let us know and we will arrange it with you.

        Best regards.
      words:
        delivery: "${quantity} ${uom} on ${date}"
        cut: " (quantity now ${quantity} ${uom})"
        cancelled: "cancelled, not delivered"
        reason.overcapacity: "as our production is over capacity"
        reason.ng: "as part of the goods did not pass inspection"
        reason.short_stock: "as materials are short"
        reason.other: "as our production plan has changed"
    ja:
      subject: "ご注文 ${po_no} 納期変更のお知らせ"
      line: "- ${line_no}行目: ${customer_item_code}: ${deliveries}${cut}"
      body: |-
        ${customer_name} 御中

        ${reason}、ご注文 ${po_no}（弊社受注番号 ${bravo_so_no}）の納期を以下のとおり変更させていただきます。

        ${lines}

        ご迷惑をおかけし申し訳ございません。新しい納期で不都合がございましたら、ご連絡ください。

        よろしくお願いいたします。
      words:
        delivery: "${date} ${quantity} ${uom}"
        cut: "（数量 ${quantity} ${uom} に変更）"
        cancelled: "キャンセル（納品なし）"
        reason.overcapacity: "生産能力の都合により"
        reason.ng: "一部製品が検査に合格しなかったため"
        reason.short_stock: "材料不足のため"
        reason.other: "生産計画の変更により"

  # The example of an answer to a customer's question about an order (ticket
  # 32): never drawn as a draft; `${answer}` is what DW1's model writes from
  # the order's facts, every figure among them.
  question_answer:
    vi:
      subject: "Trả lời về đơn hàng ${po_no}"
      body: |-
        Kính gửi ${customer_name},

        Cảm ơn quý khách đã hỏi về đơn hàng ${po_no}.

        ${answer}

        Trân trọng.
    en:
      subject: "Re: your order ${po_no}"
      body: |-
        Dear ${customer_name},

        Thank you for your question about order ${po_no}.

        ${answer}

        Best regards.
    ja:
      subject: "ご注文 ${po_no} についてのご回答"
      body: |-
        ${customer_name} 御中

        ご注文 ${po_no} についてお問い合わせいただき、ありがとうございます。

        ${answer}

        よろしくお願いいたします。

  design_code_request:
    vi:
      subject: "Cần Design tạo mã: ${customer_code} PO ${po_no}"
      line: "- Dòng ${line_no}: mã khách ${customer_item_code}, ${description}, ${quantity} ${uom}, ngày yêu cầu ${requested_date}"
      body: |-
        Gửi Design,

        PO ${po_no} (lần sửa ${revision}) của ${customer_name} (${customer_code}) có các dòng chưa có mã PRV, không có trong danh mục quy đổi và không khớp sản phẩm nào theo thông số:

        ${lines}

        Nhờ Design tạo mã và báo lại cho Sales.

  # ---------------------------------------------------------------- quotes --
  design_request_draft:
    vi:
      subject: "YCBG ${ycbg_no}: ${customer_name} (${rfq_no})"
      line: "- Dòng ${line_no}: mã khách ${customer_item_code}, mã PRV đã biết ${known_prv_code}, ${description}, ${quantity} ${uom}, cần trước ${needed_by}"
      body: |-
        Gửi Design,

        Nhờ Design xem yêu cầu báo giá ${rfq_no} của ${customer_name} (${customer_code}), phiếu YCBG ${ycbg_no}, hạn báo giá ${quote_due}:

        ${lines}

        Khi trả lời, xin ghi số YCBG ${ycbg_no}.

  spec_discussion_draft:
    vi:
      subject: "Về yêu cầu báo giá ${rfq_no}: thông số đề xuất"
      line: "- Dòng ${line_no}: ${customer_item_code} ${description}: mã thiết kế ${bp_code}, thông số số ${spec_no}"
      body: |-
        Kính gửi ${customer_name},

        Với yêu cầu báo giá ${rfq_no}, bộ phận thiết kế của chúng tôi đề xuất thông số sau:

        ${lines}

        Mong quý khách xem và cho ý kiến trước khi chúng tôi báo giá.

        Trân trọng.
    en:
      subject: "Your request for quotation ${rfq_no}: proposed specification"
      line: "- Line ${line_no}: ${customer_item_code} ${description}: design ${bp_code}, specification ${spec_no}"
      body: |-
        Dear ${customer_name},

        For your request for quotation ${rfq_no}, our design team proposes the following specification:

        ${lines}

        Please review it and let us know your comments before we quote.

        Best regards.
    ja:
      subject: "お見積り依頼 ${rfq_no}：仕様のご提案"
