schema_version: "1.0"
copy_id: sales_handoffs
version: "1.2.0"

# The words of a hand-off Sales sends to PC or QA from a customer's mail
# (ticket 33, dw_sales ADR 0005). Code fills every placeholder from what it
# located, parsed and resolved in the mail; the customer's own sentences go in
# quotation marks, as theirs. The model writes no word of it. Sales reviews,
# edits and sends it from their own mailbox: DW1 sends nothing and changes no
# date or quantity in the ERP.
#
# Platform layer, fictional wording. A tenant's own wording arrives as its own
# version of this file (ticket 19), never as an edit to this one.
#
# 1.1.0 (ticket 07): `pc_request`, the request Sales sends PC for an order's
# delivery dates, written from the order case (its lines as entered), not
# from a mail. Nothing else changed from 1.0.0.
#
# 1.2.0 (ticket 06): `design_request`, the request Sales sends Design to
# create a PRV code for a line no item fits, written from the order case (the
# line as the PO prints it) and the codes of the item master nearest it.
# Nothing else changed from 1.1.0.
#
# {customer} the customer code; {po} the PO the mail names, when it resolved to
# one of the customer's orders; {message_id} the mail in the Sales mailbox;
# {lines} one `line` per line asked to change; {lot} the lot as the customer
# wrote it; {quotes} one `quote` per sentence or item; {quantity} the sample
# quantity. A value code did not keep is written as `unknown`.

unknown: "(chưa rõ, Sales điền)"
line: "- Dòng {line_no} ({item}): số lượng mới {quantity}; ngày giao mới {date}"
quote: "  «{text}»"

templates:
  delivery_change:
    to: pc
    subject: "[Chuyển PC] Khách {customer} đề nghị đổi giao hàng – PO {po}"
    body: |
      Chào anh/chị PC,

      Khách {customer} đề nghị thay đổi giao hàng cho PO {po}:
      {lines}

      Nhờ PC xem khả năng và báo lại ngày có thể giao; Sales xác nhận với
      khách sau. Chưa có thay đổi nào trên Bravo.

      Thư gốc của khách: {message_id} trong hộp thư Sales.

      Sales
  complaint:
    to: qa
    subject: "[Chuyển QA] Khách {customer} phản ánh chất lượng – PO {po}, lô {lot}"
    body: |
      Chào anh/chị QA,

      Khách {customer} phản ánh về hàng đã giao theo PO {po}, lô {lot}.
      Khách viết:
      {quotes}

      Nhờ QA kiểm tra và hướng dẫn Sales trả lời khách.

      Thư gốc của khách: {message_id} trong hộp thư Sales.

      Sales
  sample_request:
    to: pc
    subject: "[Chuyển PC] Khách {customer} xin hàng mẫu"
    body: |
      Chào anh/chị PC,

      Khách {customer} xin hàng mẫu:
      {quotes}
      Số lượng khách nêu: {quantity}.

      Nhờ PC xem khả năng chuẩn bị mẫu và báo lại cho Sales.

      Thư gốc của khách: {message_id} trong hộp thư Sales.

      Sales

# The request to PC for an order's delivery dates (ticket 07). {customer} the
# customer code, {po} the PO number, {lines} one `line` per line asked: its
# number, {item} the PRV code, {customer_item} the customer's code,
# {quantity}, {uom} and {requested_date} as the order is entered.
pc_request:
  subject: "[Hỏi PC] Ngày giao cho PO {po} của khách {customer}"
  line: "- Dòng {line_no}: {item} (mã khách {customer_item}), {quantity} {uom}, khách cần ngày {requested_date}"
  body: |
    Chào anh/chị PC,

    Khách {customer} đặt PO {po}. Nhờ PC xem và báo ngày có thể giao cho các dòng sau:
    {lines}

    Nếu một dòng phải giao làm nhiều đợt, xin ghi số lượng và ngày của từng đợt.

    Sales

# The request to Design for a new PRV code (ticket 06). {customer} the
# customer code, {po} the PO number, {line_no}, {customer_item} the customer's
# code, {description} as the PO prints it, {quantity}, {uom} and
# {requested_date} as the order is entered; {nearest} one `nearest` per code
# of the item master nearest the line ({code} and its {description}), at most
# three, or `no_nearest`. Only codes the item master holds are ever written.
design_request:
  subject: "[Đề nghị tạo mã] PO {po} dòng {line_no} – mã khách {customer_item}"
  nearest: "- {code}: {description}"
  no_nearest: "- (DW1 không tìm được mã gần trong danh mục mã hàng)"
  body: |
    Chào anh/chị Design,

    Khách {customer} đặt PO {po}. Dòng {line_no} chưa có mã PRV trong danh mục:
    - Mã khách: {customer_item}
    - Mô tả trên PO: {description}
    - Số lượng: {quantity} {uom}, khách cần ngày {requested_date}

    Các mã gần nhất trong danh mục mã hàng:
    {nearest}

    Nhờ Design tạo mã mới (hoặc chỉ mã đúng nếu đã có) và trả lời thư này với
    mã PRV. Sales xác nhận mã trên đơn sau khi nhận được.

    Sales
