schema_version: "1.0"
copy_id: sales_documents
version: "1.0.0"
mock: true
description: >-
  The words of every sheet and document DW1 prepares for Sales (dw_sales
  ticket 06): titles, heading labels and column headers, keyed by artifact
  kind and language. MOCK: fictional forms for the demo seller. The customer's
  own forms arrive only as a tenant version of this copy (spec decision 14).
  Read by dw_sales.application.artifact_content.SalesDocumentCopy.

# Internal sheets are in Vietnamese; the quotation is in the language of the
# customer it is addressed to. A label or a word a sheet needs and this copy
# lacks refuses to render, and so does a (kind, language) with no entry.

documents:
  # What every internal sheet carries below its own heading.
  common:
    vi:
      title: "Thông tin chung"
      labels:
        case_version: "Phiên bản hồ sơ"
        template: "Mẫu"
        generated_at: "Tạo lúc (giờ Việt Nam)"

  # The second sheet of the upload file; the import sheet's own layout is
  # configs/policies/sales_bravo_upload@<version>.yaml.
  bravo_upload:
    vi:
      title: "File nhập Bravo"
      labels:
        sheet: "Ghi chu"
      words:
        mock: "MẪU GIẢ LẬP (MOCK) theo ${layout}: chưa phải mẫu nhập Bravo của khách hàng. Kiểm tra trước khi nhập."

  cross_check_sheet:
    vi:
      title: "Phiếu kiểm chéo đơn hàng (WIV-03-012 bước 9)"
      labels:
        sheet: "Kiem cheo"
        customer: "Khách hàng"
        po_no: "Số PO"
        revision: "Lần sửa"
        bravo_so_no: "Số đơn bán trên Bravo"
        bravo_recorded_by: "Người nhập Bravo"
        bravo_recorded_at: "Thời điểm ghi số đơn"
        prepared_by: "Người tự kiểm"
      columns:
        line_no: "Dòng"
        field: "Giá trị"
        po_value: "Trên PO"
        anchor: "Vị trí trên PO"
        upload_value: "Trong file nhập Bravo"
        findings: "Điểm cần xem"
        disposition: "Quyết định"
        typed_by: "Sales nhập tay"
        customer_item_code: "Mã hàng của khách"
        prv_code: "Mã PRV"
        description: "Mô tả"
        quantity: "Số lượng"
        uom: "Đơn vị tính"
        unit_price: "Đơn giá"
        amount: "Thành tiền"
        requested_date: "Ngày khách yêu cầu"
