  master_list_update:
    vi:
      title: "Cập nhật danh sách báo giá (master list)"
      labels:
        sheet: "Master list"
      columns:
        quote_no: "Số báo giá"
        customer_code: "Mã khách hàng"
        prv_code: "Mã PRV"
        unit_price: "Đơn giá"
        currency: "Tiền tệ"
        uom: "Đơn vị tính"
        moq: "MOQ"
        lead_time_days: "Thời gian giao (ngày)"
        copper_basis: "Căn cứ giá đồng"
        valid_from: "Hiệu lực từ"
        valid_to: "Hiệu lực đến"
