repos:
  # The project's own ruff (uv.lock), the one CI and `make lint` run. A pinned
  # ruff-pre-commit rev was a second copy of that version: at v0.9.10 beside a
  # locked 0.16.8 it refused lines the project's ruff accepts (UP038).
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^infra/helm/
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      # Sales ticket 26: no customer data in a staged file of this public repo.
      # The deny-list lives outside git (DW_PUBLIC_REPO_DENYLIST); without one
      # the script skips and says so, and CI runs it over the whole tree.
      - id: public-repo-guard
        name: public-repo guard (deny-list outside git)
        entry: uv run python scripts/check_public_repo.py --staged
        language: system
        pass_filenames: false
        always_run: true
        # pre-commit hides a passing hook's output, and a skip passes: without
        # this the "SKIPPED, customer data was NOT checked" banner never shows.
        verbose: true
