packages:
  - apps/web
  - packages/typescript/*
allowBuilds:
  # Cố ý `false`. Gói này có postinstall, và nội dung của nó là telemetry: đọc
  # version rồi gọi về nhà lúc cài. Không có nó gói vẫn chạy bình thường -
  # chính script tự bọc trong try/catch vì nó cũng biết vậy.
  "@openuidev/lang-core": false
  sharp: true
  unrs-resolver: true
# Force patched versions of vulnerable transitive deps (pnpm audit high+).
# Each replacement is capped below the next major: an open-ended ">=x.y.z" takes
# the newest release overall, which drags a transitive dep across a breaking
# change it never asked for. js-yaml 5 dropping `types.merge` did exactly that
# to @redocly/openapi-core, breaking `make generate-contracts`.
overrides:
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2 <5"
  "sharp@<0.35.4": ">=0.35.4 <0.36"
  "postcss@<8.5.23": ">=8.5.23 <9"
  # CVE-2026-67213, reached through postcss. Overriding nanoid rather than
  # raising the postcss floor to 8.5.26 covers every path to it, not just the
  # one postcss happens to pin today.
  "nanoid@<3.3.17": ">=3.3.17 <4"
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p (nested-brace recursion), each line.
  "brace-expansion@<1.1.20": "^1.1.20"
  "brace-expansion@>=2.0.0 <2.1.6": "^2.1.6"
  "brace-expansion@>=4.0.0 <5.0.11": "^5.0.11"
  # GHSA-68fv-2mgg-jv7q / CVE-2026-93749, reached through postcss and
  # @tailwindcss/node; also what trivy finds in the dw-web image.
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"

# An ignore is a decision, not a fix: each entry names why it is safe and what
# ends it. It is keyed by GHSA, so a NEW advisory on the same package still fails.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion. No patched release exists (GitHub lists
    # first_patched_version: null; npm latest is 3.0.3; micromatch/braces#70
    # still open on 2026-10-06), so no override can fix it. The only path is
    # eslint-config-next > @next/eslint-plugin-next > fast-glob 3.3.1 (pinned
    # exactly by every plugin release through 16.3.8) > micromatch > braces:
    # dev-only, absent from every image trivy scans, and its sole input is
    # `settings.next.rootDir` from our own ESLint config, never user input.
    # Remove this and add a capped override once braces 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm

# `@openuidev/assistant-ui` declares a peer on the Vercel AI SDK, but only its
# `/ai-sdk` subpath imports it - and that subpath is for the AI SDK runtime,
# which this app does not use. The chat backend is Python/LangGraph behind
# `useExternalStoreRuntime`, so installing `ai` would put a second runtime in
# the tree that nothing runs. Verified against 0.0.3: `dist/index.mjs` imports
# only @assistant-ui/react, @openuidev/react-ui, @openuidev/react-lang and zod.
peerDependencyRules:
  ignoreMissing:
    - ai
